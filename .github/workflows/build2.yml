name: Build AN758x U-Boot 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - xg-040g-md
          - xg-040g-mf

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison ca-certificates curl device-tree-compiler flex \
            gcc-aarch64-linux-gnu gcc-arm-none-eabi libssl-dev \
            python3 python3-pyelftools swig

      - name: Download Mbed TLS
        run: |
          curl -L https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v3.4.1.tar.gz |
            tar -xz
          echo "MBEDTLS_DIR=$PWD/mbedtls-3.4.1" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.target }}
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
          ARM32_CROSS_COMPILE: arm-none-eabi-
          BUILD_JOBS: 4
          AIROHA_SIGN_KEY: ${{ secrets.AIROHA_SIGN_KEY }}
        run: ./scripts/build-an758x.sh "${{ matrix.target }}"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: an758x-${{ matrix.target }}
          path: output/${{ matrix.target }}/an75*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: an758x-*
          path: release
          merge-multiple: true

      - name: Set Environment Variable
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ env.WRT_DATE }}"
          gh release create "$release_tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AN758x U-Boot ${release_tag}" \
            --generate-notes
